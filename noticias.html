<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Noticias de economía, mercados y política de Argentina, actualizadas cada seis horas y sin registro.">
<title>Noticias — Pampa Finance</title>
<link rel="icon" href="icono.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="main">

    <header class="page-head">
        <span class="eyebrow">Actualidad</span>
        <h1 class="title">Lo que mueve <strong>el mercado</strong>.</h1>
        <p class="lede" id="answer">Cargando noticias…</p>
        <div class="meta-row">
            <span class="dot" data-sync-dot></span>
            <span data-sync>cargando datos</span>
            <span>12 fuentes RSS</span>
        </div>
    </header>

    <section class="section">
        <div class="section__head" style="align-items:center">
            <div class="chips" id="filters">
                <button class="chip is-active" data-cat="all" type="button">Todas</button>
                <button class="chip" data-cat="Economía" type="button">Economía</button>
                <button class="chip" data-cat="Mercados" type="button">Mercados</button>
                <button class="chip" data-cat="Política" type="button">Política</button>
                <button class="chip" data-cat="Negocios" type="button">Negocios</button>
            </div>
            <label class="field__label" style="gap:0;width:240px;max-width:100%">
                <input id="search" type="search" placeholder="Buscar en los títulos" style="text-align:left;font-family:var(--mono);font-size:12.5px;padding:9px 12px;background:var(--bg-1);border:1px solid var(--line);border-radius:2px;color:var(--fg)">
            </label>
        </div>
        <div class="news-grid reveal" id="grid" data-error>
            <div class="news-card"><span class="skeleton" style="width:70%"></span></div>
        </div>
        <div style="display:flex;justify-content:center;margin-top:26px">
            <button class="btn" id="more" type="button" style="display:none">Cargar más <span class="btn__icon">↓</span></button>
        </div>
    </section>

    <footer class="foot">
        <span>Pampa Finance · titulares de medios argentinos, sin reescribir</span>
        <span><a href="index.html">Cotizaciones</a> · <a href="Graficos historicos.html">Series</a></span>
    </footer>
</main>

<script src="data-sources.js"></script>
<script src="api-service.js"></script>
<script src="app.js"></script>
<script>
(function () {
    var Fmt = PF.Fmt;
    var PAGE = 12;

    PF.withData(['news'], function (api) {
        var articles = api.getNews().slice().sort(function (a, b) { return b.date - a.date; });
        var cat = 'all';
        var query = '';
        var shown = PAGE;

        if (articles.length) {
            var latest = articles[0];
            document.getElementById('answer').innerHTML =
                'Último titular: <b>' + Fmt.esc(latest.title) + '</b> · ' + Fmt.esc(latest.source) + ' (' + Fmt.ago(latest.date) + '). ' +
                'Hay ' + articles.length + ' notas de las últimas horas.';
        }

        function filtered() {
            return articles.filter(function (a) {
                if (cat !== 'all' && a.category !== cat) return false;
                if (!query) return true;
                var hay = (a.title + ' ' + a.description + ' ' + a.source).toLowerCase();
                return hay.indexOf(query) !== -1;
            });
        }

        function card(a) {
            var desc = a.description || '';
            return '<a class="news-card" href="' + Fmt.esc(a.link) + '" target="_blank" rel="noopener">' +
                '<span class="news-card__top"><span class="tag">' + Fmt.esc(a.category) + '</span><span>' + Fmt.ago(a.date) + '</span></span>' +
                '<h3>' + Fmt.esc(a.title) + '</h3>' +
                (desc ? '<p>' + Fmt.esc(desc) + '</p>' : '') +
                '<span class="news-card__foot"><span>' + Fmt.esc(a.source) + '</span><span>leer ↗</span></span>' +
            '</a>';
        }

        function draw() {
            var rows = filtered();
            var slice = rows.slice(0, shown);
            var grid = document.getElementById('grid');
            grid.innerHTML = slice.length ? slice.map(card).join('') : '<div class="empty">No hay notas con ese filtro</div>';
            var more = document.getElementById('more');
            more.style.display = rows.length > shown ? 'inline-flex' : 'none';
            more.textContent = '';
            more.innerHTML = 'Cargar más (' + (rows.length - shown) + ') <span class="btn__icon">↓</span>';
            PF.reveal(grid);
        }

        document.getElementById('filters').addEventListener('click', function (e) {
            var btn = e.target.closest('.chip');
            if (!btn) return;
            cat = btn.getAttribute('data-cat');
            shown = PAGE;
            Array.prototype.forEach.call(document.querySelectorAll('#filters .chip'), function (c) {
                c.classList.toggle('is-active', c === btn);
            });
            draw();
        });

        var searchEl = document.getElementById('search');
        var t;
        searchEl.addEventListener('input', function () {
            clearTimeout(t);
            t = setTimeout(function () {
                query = searchEl.value.trim().toLowerCase();
                shown = PAGE;
                draw();
            }, 140);
        });

        document.getElementById('more').addEventListener('click', function () {
            shown += PAGE;
            draw();
        });

        draw();
        PF.reveal();
    });
})();
</script>
</body>
</html>
